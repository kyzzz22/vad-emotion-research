<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>操作と感情 — 手順確認</title><link rel="stylesheet" href="style.css"><main><p class="tag">研究者用・動作確認版 / v0.1</p><h1>操作と感情の評価</h1><p>日語版SAMの確認前です。正式な実験データの収集には使用しないでください。回答はサーバーに送信されません。</p><section id="setup"><label>練習用ID <input id="pid" value="DEMO01" pattern="[A-Za-z0-9_-]{1,32}" maxlength="32"></label><label>提示順序 <select id="order"><option value="CRRC">A</option><option value="RCCR">B</option></select></label><p>左右の矢印キーまたは画面のボタンで青い丸を動かし、中央の枠に近づけてください。操作が反映される区間と、自動で動く区間があります。</p><button id="start">練習を始める</button></section><section id="task" hidden><h2 id="heading"></h2><p id="remaining" aria-live="off"></p><div id="track"><div id="target"></div><div id="dot"></div></div><div class="controls"><button id="left" aria-label="左へ">← 左</button><button id="right" aria-label="右へ">右 →</button></div><button id="stop">中止する</button></section><section id="rating" hidden><h2>直前の区間について</h2><form id="form"></form></section><section id="done" hidden><h2>手順確認が終わりました</h2><p id="summary"></p></section><button id="download" hidden>記録をJSONで保存</button><p id="notice" role="status"></p></main><script src="app.js"></script></html>
